services:
  webhook-gateway:
    image: nginx:stable-alpine
    networks:
      - frappe_network
    volumes:
      - ./webhook-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
  shopify-tunnel:
    image: cloudflare/cloudflared:latest
    networks:
      - frappe_network
    command: tunnel --no-autoupdate --url http://webhook-gateway:8081
    depends_on:
      - webhook-gateway
